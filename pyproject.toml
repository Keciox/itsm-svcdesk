[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svcdesk"
version = "0.1.0"
description = "Reference service-desk API for ITSM Lab 1 (WSB Merito, 2026/27): the checker's test oracle and the checkpoint/lab-1 starting point"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.52.4",
    "tzdata>=2025.1",
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
]

[project.optional-dependencies]
tests = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/svcdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.uv]
# The repo is used with plain `uv venv` + `uv pip install -e .`; `uv run` then uses .venv without a lock file.
managed = false
