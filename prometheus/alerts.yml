# ai-generated: 100% - Claude Code (Opus 5.5) wrote this file from design/LAB3.md sections 3.5-3.7; the lecturer reviews it
# svcdesk /kb/search: the latency SLO of slo.md (99 % of requests within 0.3 s over 28 days) and its
# multiwindow, multi-burn-rate alerts (the SRE Workbook, "Alerting on SLOs", table 5-8).
groups:
  - name: svcdesk-kb-search-latency-slo
    rules:
      # the share of requests slower than 0.3 s (the SLI's "bad"), over the four windows the alerts use
      - record: slo:kb_search_latency_bad:ratio_rate5m
        expr: |
          1 - (
            sum(rate(http_server_request_duration_seconds_bucket{job="svcdesk", http_route="/kb/search", le="0.3"}[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search"}[5m]))
          )
      - record: slo:kb_search_latency_bad:ratio_rate30m
        expr: |
          1 - (
            sum(rate(http_server_request_duration_seconds_bucket{job="svcdesk", http_route="/kb/search", le="0.3"}[30m]))
            /
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search"}[30m]))
          )
      - record: slo:kb_search_latency_bad:ratio_rate1h
        expr: |
          1 - (
            sum(rate(http_server_request_duration_seconds_bucket{job="svcdesk", http_route="/kb/search", le="0.3"}[1h]))
            /
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search"}[1h]))
          )
      - record: slo:kb_search_latency_bad:ratio_rate6h
        expr: |
          1 - (
            sum(rate(http_server_request_duration_seconds_bucket{job="svcdesk", http_route="/kb/search", le="0.3"}[6h]))
            /
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search"}[6h]))
          )
      # 2 % of the 28-day budget in one hour: page at once (P1)
      - alert: KbSearchLatencyBurnFast
        expr: |
          slo:kb_search_latency_bad:ratio_rate1h > 14.4 * (1 - 0.99)
          and
          slo:kb_search_latency_bad:ratio_rate5m > 14.4 * (1 - 0.99)
        for: 2m
        labels:
          service: svcdesk
          slo: latency
          severity: P1
        annotations:
          summary: "/kb/search is spending its latency error budget 14.4 times too fast"
          description: "Over the last hour and the last 5 minutes more than 14.4 % of /kb/search requests took longer than 0.3 s."
      # 5 % of the budget in six hours: chat, not a page (P2); the next business hour is soon enough
      - alert: KbSearchLatencyBurnSlow
        expr: |
          slo:kb_search_latency_bad:ratio_rate6h > 6 * (1 - 0.99)
          and
          slo:kb_search_latency_bad:ratio_rate30m > 6 * (1 - 0.99)
        for: 5m
        labels:
          service: svcdesk
          slo: latency
          severity: P2
        annotations:
          summary: "/kb/search is spending its latency error budget 6 times too fast"
          description: "Over the last 6 hours and the last 30 minutes more than 6 % of /kb/search requests took longer than 0.3 s."
